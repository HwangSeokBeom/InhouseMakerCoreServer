name: Server Production Deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: server-deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to production EC2
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Guard main branch
        run: |
          set -euo pipefail
          if [[ "${GITHUB_REF_NAME}" != "main" ]]; then
            echo "::error::This workflow only deploys the main branch."
            exit 1
          fi

      - name: Configure SSH
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_SSH_PORT: ${{ secrets.EC2_SSH_PORT }}
          EC2_USER: ${{ secrets.EC2_USER }}
          EC2_SSH_PRIVATE_KEY: ${{ secrets.EC2_SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail

          : "${EC2_HOST:?EC2_HOST is required}"
          : "${EC2_SSH_PORT:?EC2_SSH_PORT is required}"
          : "${EC2_USER:?EC2_USER is required}"
          : "${EC2_SSH_PRIVATE_KEY:?EC2_SSH_PRIVATE_KEY is required}"

          mkdir -p "${HOME}/.ssh"
          chmod 700 "${HOME}/.ssh"
          printf '%s\n' "${EC2_SSH_PRIVATE_KEY}" > "${HOME}/.ssh/id_ed25519"
          chmod 600 "${HOME}/.ssh/id_ed25519"
          ssh-keyscan -p "${EC2_SSH_PORT}" -H "${EC2_HOST}" >> "${HOME}/.ssh/known_hosts"

      - name: Bootstrap repository on EC2
        env:
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_SSH_PORT: ${{ secrets.EC2_SSH_PORT }}
          EC2_USER: ${{ secrets.EC2_USER }}
          TARGET_BRANCH: main
          GITHUB_REPOSITORY: ${{ github.repository }}
          DEPLOY_REPOSITORY_URL: https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git
        run: |
          set -euo pipefail

          : "${DEPLOY_PATH:?DEPLOY_PATH is required}"

          ssh -p "${EC2_SSH_PORT}" "${EC2_USER}@${EC2_HOST}" \
            "DEPLOY_PATH='${DEPLOY_PATH}' TARGET_BRANCH='${TARGET_BRANCH}' GITHUB_REPOSITORY='${GITHUB_REPOSITORY}' DEPLOY_REPOSITORY_URL='${DEPLOY_REPOSITORY_URL}' bash -s" <<'EOF'
          set -euo pipefail

          if [[ -e "${DEPLOY_PATH}" && ! -d "${DEPLOY_PATH}" ]]; then
            echo "[bootstrap][error] DEPLOY_PATH exists but is not a directory: ${DEPLOY_PATH}" >&2
            exit 1
          fi

          if [[ -d "${DEPLOY_PATH}" && ! -d "${DEPLOY_PATH}/.git" ]] && [[ -n "$(find "${DEPLOY_PATH}" -mindepth 1 -maxdepth 1 2>/dev/null)" ]]; then
            echo "[bootstrap][error] DEPLOY_PATH exists and is not a git repository: ${DEPLOY_PATH}" >&2
            exit 1
          fi

          if [[ ! -d "${DEPLOY_PATH}/.git" ]]; then
            mkdir -p "${DEPLOY_PATH}"
            git -C "${DEPLOY_PATH}" init
            git -C "${DEPLOY_PATH}" remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
            git -C "${DEPLOY_PATH}" fetch "${DEPLOY_REPOSITORY_URL}" "${TARGET_BRANCH}"
            git -C "${DEPLOY_PATH}" checkout -B "${TARGET_BRANCH}" FETCH_HEAD
          fi
          EOF

      - name: Upload production environment file
        env:
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_SSH_PORT: ${{ secrets.EC2_SSH_PORT }}
          EC2_USER: ${{ secrets.EC2_USER }}
          ENV_FILE: ${{ secrets.ENV_FILE }}
        run: |
          set -euo pipefail

          : "${ENV_FILE:?ENV_FILE is required}"

          temp_env_file="$(mktemp)"
          trap 'rm -f "${temp_env_file}"' EXIT

          printf '%s' "${ENV_FILE}" > "${temp_env_file}"
          scp -P "${EC2_SSH_PORT}" "${temp_env_file}" "${EC2_USER}@${EC2_HOST}:${DEPLOY_PATH}/.env.production"
          ssh -p "${EC2_SSH_PORT}" "${EC2_USER}@${EC2_HOST}" "chmod 600 '${DEPLOY_PATH}/.env.production'"

      - name: Run production deployment
        env:
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_SSH_PORT: ${{ secrets.EC2_SSH_PORT }}
          EC2_USER: ${{ secrets.EC2_USER }}
          TARGET_BRANCH: main
          DEPLOY_REPOSITORY_URL: https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git
        run: |
          set -euo pipefail

          ssh -p "${EC2_SSH_PORT}" "${EC2_USER}@${EC2_HOST}" \
            "cd '${DEPLOY_PATH}' && GITHUB_REF_NAME='${TARGET_BRANCH}' DEPLOY_REPOSITORY_URL='${DEPLOY_REPOSITORY_URL}' bash scripts/deploy-production.sh"
