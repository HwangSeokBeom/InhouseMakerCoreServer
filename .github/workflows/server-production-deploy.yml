name: Server Production Deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: server-deploy-production
  cancel-in-progress: false

jobs:
  validate:
    name: Validate production release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx prisma generate
      - run: npm run typecheck
      - run: npm run build
      - run: npm test -- --runInBand

  deploy:
    name: Deploy exact commit to production EC2
    if: github.ref == 'refs/heads/main'
    needs: validate
    runs-on:
      - self-hosted
      - linux
      - x64
      - inhousemaker-core
      - deploy
      - ec2-ap-northeast-2
    environment: production
    timeout-minutes: 30
    env:
      DEPLOY_PATH: /opt/inhousemaker/server

    steps:
      - name: Guard production release
        run: |
          set -euo pipefail
          [[ "${GITHUB_REF_NAME}" == "main" ]]
          [[ -n "${GITHUB_SHA}" ]]

      - name: Sync production clone to pushed commit
        env:
          REPOSITORY_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          if [[ -e "${DEPLOY_PATH}" && ! -d "${DEPLOY_PATH}" ]]; then
            echo "::error::DEPLOY_PATH exists but is not a directory: ${DEPLOY_PATH}"
            exit 1
          fi

          mkdir -p "${DEPLOY_PATH}"

          if [[ ! -d "${DEPLOY_PATH}/.git" ]]; then
            if [[ -n "$(find "${DEPLOY_PATH}" -mindepth 1 -maxdepth 1 ! -name '.env.production' 2>/dev/null)" ]]; then
              echo "::error::DEPLOY_PATH contains unexpected files before bootstrap."
              exit 1
            fi
            git -C "${DEPLOY_PATH}" init
            git -C "${DEPLOY_PATH}" remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          fi

          git -C "${DEPLOY_PATH}" fetch --no-tags \
            "https://x-access-token:${REPOSITORY_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" \
            "${GITHUB_SHA}"
          git -C "${DEPLOY_PATH}" checkout -B main FETCH_HEAD
          git -C "${DEPLOY_PATH}" reset --hard "${GITHUB_SHA}"

          [[ "$(git -C "${DEPLOY_PATH}" rev-parse HEAD)" == "${GITHUB_SHA}" ]]
          [[ -z "$(git -C "${DEPLOY_PATH}" status --porcelain --untracked-files=no)" ]]

      - name: Install production environment
        env:
          ENV_FILE: ${{ secrets.ENV_FILE }}
        run: |
          set -euo pipefail
          : "${ENV_FILE:?ENV_FILE is required}"
          umask 077
          printf '%s' "${ENV_FILE}" > "${DEPLOY_PATH}/.env.production"

      - name: Deploy and verify readiness
        run: |
          set -euo pipefail
          cd "${DEPLOY_PATH}"
          GITHUB_REF_NAME=main \
          SKIP_REPOSITORY_SYNC=1 \
          EXPECTED_GIT_SHA="${GITHUB_SHA}" \
            bash scripts/deploy-production.sh
