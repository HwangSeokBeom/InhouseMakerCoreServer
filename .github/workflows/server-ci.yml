name: Server CI

on:
  pull_request:
    branches:
      - dev
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: server-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Lint, Build, Test
    runs-on: ubuntu-latest
    env:
      NODE_ENV: test
      PORT: 3000
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/inhousemaker_test
      REDIS_URL: redis://127.0.0.1:6379
      JWT_ACCESS_SECRET: test-access-secret
      JWT_REFRESH_SECRET: test-refresh-secret
      JWT_ACCESS_EXPIRES_IN: 1h
      JWT_REFRESH_EXPIRES_IN: 30d
      RIOT_APP_ID: test-app-id
      RIOT_API_KEY: test-api-key
      RIOT_ACCOUNT_REGION: asia
      RIOT_PLATFORM_REGION: kr
      RIOT_SYNC_MAX_RETRIES: 5
      RIOT_SYNC_BACKOFF_MS: 2000
      APPLE_CLIENT_ID: test.apple.client
      APPLE_AUDIENCE: test.apple.audience
      GOOGLE_CLIENT_ID: test.google.client
      GOOGLE_AUDIENCE: test.google.audience
      ALLOW_SWAGGER: false
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Run lint
        run: npm run lint

      - name: Run build
        run: npm run build

      - name: Run tests
        run: npm test
